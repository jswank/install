# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
schema: v1
repo: jdx/fnox
default_version: v1.46.0 # renovate: datasource=github-releases depName=jdx/fnox
asset:
  template: fnox-${ARCH}-${OS}${EXT}
  default_extension: .tar.gz
  rules:
  - when:
      arch: amd64
    arch: x86_64
  - when:
      arch: arm64
    arch: aarch64
  - when:
      os: darwin
    os: apple-darwin
  - when:
      os: linux
    os: unknown-linux-musl
  - when:
      os: windows
    os: pc-windows-msvc
  - when:
      os: windows
    ext: .zip
