# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
schema: v1
repo: aaif-goose/goose
default_version: v1.57.0 # renovate: datasource=github-releases depName=aaif-goose/goose
asset:
  template: goose-${ARCH}-${OS}${EXT}
  default_extension: .tar.bz2
  rules:
    - when:
        arch: amd64
      arch: x86_64
    - when:
        arch: arm64
      arch: aarch64
    - when:
        os: darwin
      os: apple-darwin
    - when:
        os: linux
      os: unknown-linux-musl
    - when:
        os: windows
      os: pc-windows-msvc
    - when:
        os: windows
      template: goose-${ARCH}-${OS}-cuda${EXT}
      ext: .zip
